<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 10 Instituições - Paraíba</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Barra de Navegação em Vermelho -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Censo Escolar PB</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="instituicoes.html">Instituições de Ensino</a>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1 text-danger">Top 10 Instituições de Ensino da Paraíba</h2>
        <p class="text-muted mb-0">Classificação por total de matrículas na educação básica (qt_mat_bas).</p>
      </div>
      <a href="index.html" class="btn btn-outline-danger">Voltar à Home</a>
    </div>

    <!-- Alerta de Carregamento em Tom Avermelhado -->
    <div id="loading" class="alert alert-danger text-center">
      A carregar o ranking das escolas...
    </div>

    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th class="text-center" style="width: 70px;">#</th>
              <th>Nome da Instituição</th>
              <th>Município</th>
              <th class="text-center">Total de Matrículas</th>
              <th class="text-center">Fundamental</th>
              <th class="text-center">Médio</th>
              <th class="text-center">Profissional</th>
            </tr>
          </thead>
          <tbody id="tabela-escolas"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="src/js/ranking.js"></script>
</body>
</html>
